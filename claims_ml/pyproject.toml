[project]
name = "claims-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "melisademirbas", email = "melisademirbas30@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
